<div class="header-cartelera">
  <h3>Peliculas en cartelera</h3>

  <div class="buscador">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" [(ngModel)]="busqueda" placeholder="Buscar película...">
  </div>
</div>

  @if (peliculas() | filtro: busqueda(); as peliculasFiltradas) {
    <div class="grilla">
      @for (pelicula of peliculasFiltradas; track pelicula.id) {
        <app-carta-pelicula [id]="pelicula.id" [nombre]="pelicula.nombre" [imagen]="pelicula. imagen_url" />
      }
    </div>

  @if (peliculasFiltradas.length === 0) {
    <p class="sin-resultados">No se encontraron películas con ese nombre.</p>
  }
}
