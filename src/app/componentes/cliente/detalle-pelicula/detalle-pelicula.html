@if (pelicula(); as p) {
  <div class="detalle">
    <img [src]="p.imagen_horizontal_url" [alt]="p.nombre" />
    <div class="info">
      <h2>{{ p.nombre }}</h2>
      <p class="meta">Duración: {{ p.duracion_minutos }} min</p>
      <p class="sinopsis">{{ p.sinopsis }}</p>
      <button type="button" class="btn-comprar" [routerLink]="['/home-cliente/sala', 1]">Comprar</button>
    </div>
  </div>
}
