<div class="auth-card">
  <h2>Crear cuenta</h2>

  <form [formGroup]="formulario" (ngSubmit)="registrar()">

    <div class="campo">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" formControlName="nombre" placeholder="Ingresa tu nombre"/>
    </div>

    <div class="campo">
      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" formControlName="apellido" placeholder="Ingresa tu apellido"/>
    </div>

    <div class="campo">
      <label for="fechaNacimiento">Fecha de nacimiento</label>
      <input id="fechaNacimiento" type="date" formControlName="fechaNacimiento" />
    </div>

    <div class="campo">
      <label for="tipoSangre">Tipo de sangre</label>
      <select id="tipoSangre" formControlName="tipoSangre">
        <option value="" disabled>Selecciona tu tipo de sangre</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>
    </div>

    <div class="campo">
      <label for="colorOjos">Color de ojos</label>
      <input id="colorOjos" type="text" formControlName="colorOjos" placeholder="ej: verde"/>
    </div>

    <div class="campo">
      <label for="diasVacacionesAnio">Días de vacaciones por año</label>
      <input id="diasVacacionesAnio" type="number" formControlName="diasVacacionesAnio" />
    </div>

    <div class="campo">
      <label for="email">Mail</label>
      <input id="email" type="email" formControlName="email" placeholder="Ingresa un correo electronico" />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="Ingresa una contraseña"/>
    </div>

    @if (error()) {
      <p class="error campo-ancho">{{ error() }}</p>
    }

    <button type="submit" class="campo-ancho" [disabled]="formulario.invalid || cargando()">
      @if (cargando()) {
        Registrando...
      } @else {
        Registrarme
      }
    </button>

    <h4 class="campo-ancho">¿Ya tenes usuario?</h4>
    <button type="button" class="campo-ancho" [routerLink]="['/login']">Inicia sesion</button>
  </form>
</div>
