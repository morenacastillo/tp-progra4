<h2>Crear cuenta</h2>

<form [formGroup]="formulario" (ngSubmit)="registrar()">

  <label for="email">Mail</label>
  <input id="email" type="email" formControlName="email" />

  <label for="password">Contraseña</label>
  <input id="password" type="password" formControlName="password" />

  <label for="nombre">Nombre</label>
  <input id="nombre" type="text" formControlName="nombre" />

  <label for="apellido">Apellido</label>
  <input id="apellido" type="text" formControlName="apellido" />

  <label for="fechaNacimiento">Fecha de nacimiento</label>
  <input id="fechaNacimiento" type="date" formControlName="fechaNacimiento" />

  <label for="tipoSangre">Tipo de sangre</label>
  <input id="tipoSangre" type="text" formControlName="tipoSangre" placeholder="ej: O+" />

  <label for="colorOjos">Color de ojos</label>
  <input id="colorOjos" type="text" formControlName="colorOjos" />

  <label for="diasVacacionesAnio">Días de vacaciones por año</label>
  <input id="diasVacacionesAnio" type="number" formControlName="diasVacacionesAnio" />

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <button type="submit" [disabled]="formulario.invalid || cargando()">
    @if (cargando()) {
      Registrando...
    } @else {
      Registrarme
    }
  </button>

</form>
