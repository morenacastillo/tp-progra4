<div class="auth-card">
  <h2>Iniciar sesion</h2>

  <form [formGroup]="formulario" (ngSubmit)="login()">

    <label for="email">Mail</label>
    <input id="email" type="email" formControlName="email" placeholder="Ingresa tu correo electronico"/>

    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" placeholder="Ingresa tu contraseña"/>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="formulario.invalid || cargando()">
      @if (cargando()) {
        Ingresando...
      } @else {
        Ingresar
      }
    </button>

    <button type="button" [routerLink]="['/ingresoAnonimo']">Ingresar como anonimo</button>

    <h4>¿Todavia no tenes usuario?</h4>
    <button type="button" [routerLink]="['/registro']">Registrarse</button>
    
  </form>
</div>
