<div class="auth-card">
  <h2>Iniciar sesion</h2>

  <form [formGroup]="formulario" (ngSubmit)="login()">

    <div class="campo">
      <label for="email">Mail</label>
      <input id="email" type="email" formControlName="email" placeholder="Ingresa tu correo electronico"/>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="Ingresa tu contraseña"/>
    </div>

    @if (error()) {
      <p class="error campo-ancho">{{ error() }}</p>
    }

    <button type="submit" class="campo-ancho" [disabled]="formulario.invalid || cargando()">
      @if (cargando()) {
        Ingresando...
      } @else {
        Ingresar
      }
    </button>

    <button type="button" class="campo-ancho" [routerLink]="['/ingresoAnonimo']">Ingresar como anonimo</button>

    <h4 class="campo-ancho">¿Todavia no tenes usuario?</h4>
    <button type="button" class="campo-ancho" [routerLink]="['/registro']">Registrarse</button>

  </form>
</div>
