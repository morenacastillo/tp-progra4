<div class="auth-card">
  <h2>Ingresa como anonimo</h2>

  <form [formGroup]="formulario" (ngSubmit)="ingresar()">

    <div class="campo">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" formControlName="nombre" placeholder="Ingresa tu nombre"/>
    </div>

    <div class="campo">
      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" formControlName="apellido" placeholder="Ingresa tu apellido"/>
    </div>

    @if (error()) {
      <p class="error campo-ancho">{{ error() }}</p>
    }

    <button type="submit" class="campo-ancho" [disabled]="formulario.invalid || cargando()">
      @if (cargando()) {
        Ingresando...
      } @else {
        Ingresa como anonimo
      }
    </button>

    <h4 class="campo-ancho">¿Ya tenes usuario?</h4>
    <button type="button" class="campo-ancho" [routerLink]="['/login']">Inicia sesion</button>

  </form>
</div>
